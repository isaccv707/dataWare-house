services:
  dw_postgres:
    image: postgres:16
    container_name: dw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: dw_amazon
    ports:
      - "5432:5432"
    volumes:
      - dw_pgdata:/var/lib/postgresql/data

volumes:
  dw_pgdata:
